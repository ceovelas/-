<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Расписание">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Расписание</title>
<style>
:root{
  --bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.16);
  --sep:rgba(84,84,88,.6);--t1:#FFFFFF;--t2:rgba(235,235,245,.6);--t3:rgba(235,235,245,.3);
  --amb:#F4A73B;--ambd:#D4902E;--ambb:#F2B550;--ambt:#FFF7EA;
  --blue:#5AA0FF;--blueT:rgba(10,132,255,.16);--ambT:rgba(244,167,59,.16);--grn:#30D158;--red:#FF453A;
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.32,.72,0,1);--bounce:cubic-bezier(.34,1.3,.64,1);
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
  --f:'Manrope',-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif
}
@supports (transition-timing-function: linear(0, 1)){:root{
  --spring:linear(0,0.027,0.0937,0.1828,0.282,0.3828,0.4795,0.5687,0.6485,0.7182,0.7778,0.8277,0.8689,0.9024,0.9291,0.95,0.9661,0.9784,0.9874,0.9939,0.9985,1.0015,1.0034,1.0045,1.0049,1.005,1.0048,1.0044,1.0039,1.0034,1.0029,1.0025,1.002,1);
  --bounce:linear(0,0.0257,0.0918,0.1839,0.2901,0.4015,0.511,0.614,0.7071,0.7887,0.8578,0.9147,0.9599,0.9945,1.0197,1.037,1.0476,1.053,1.0543,1.0525,1.0487,1.0436,1.0378,1.0317,1.0258,1.0203,1.0153,1.011,1.0073,1.0043,1.0019,1.0001,0.9988,0.9979,0.9974,0.9971,0.9971,0.9972,0.9974,0.9977,1);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font-family:var(--f);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;letter-spacing:-.01em}
body{overflow:hidden}
button,a{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;letter-spacing:inherit;text-decoration:none}
input{font:inherit;color:var(--t1);-webkit-user-select:text;user-select:text;letter-spacing:inherit}
input::placeholder{color:var(--t3)}
svg{display:block;flex-shrink:0}
.ovl{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:2;font-size:16px}

/* ===== Liquid Glass: тонкий, полупрозрачный, без объема ===== */
.glass{position:relative;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),inset 0 .5px 0 rgba(255,255,255,.22)}
.tap{transition:transform .5s var(--spring),opacity .2s}
.tap:active{transform:scale(.94);opacity:.75;transition-duration:.12s}

.app{position:fixed;inset:0;overflow:hidden;background:var(--bg);transform-origin:50% 0;transition:transform .64s var(--spring),border-radius .64s var(--spring),opacity .4s}
body.sheet-open .app{transform:translateY(calc(var(--st) + 6px)) scale(.94);border-radius:36px;opacity:.55}

/* ===== верхняя панель ===== */
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(var(--st) + 6px) 16px 10px;transition:opacity .35s var(--ease),transform .5s var(--spring)}
.top::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .3s;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 .5px 0 rgba(255,255,255,.08);pointer-events:none}
.top.scrolled::before{opacity:1}
.top.away{opacity:0;transform:translateY(-12px);pointer-events:none}
.bar{position:relative;display:flex;align-items:center;gap:8px;height:52px}
.who{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px 0 6px;border-radius:26px;min-width:0;max-width:62%}
.who .tile{width:40px;height:40px;border-radius:20px;background:rgba(244,167,59,.18);color:var(--amb);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.who b{display:block;font-size:15.5px;font-weight:700;line-height:19px}
.who span{display:block;font-size:12.5px;font-weight:600;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who>div{min-width:0}
.grpb{display:flex;align-items:center;height:52px;border-radius:26px;padding:0 4px;margin-left:auto}
.grpb>*{width:46px;height:44px;display:flex;align-items:center;justify-content:center;position:relative}
.circ{width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ===== страницы ===== */
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 76px) 16px calc(var(--sb) + 120px);visibility:hidden;opacity:0;pointer-events:none}
.page.on{visibility:visible;opacity:1;pointer-events:auto}
.page.in-r{animation:pinR .64s var(--spring)}.page.in-l{animation:pinL .64s var(--spring)}
@keyframes pinR{from{opacity:0;transform:translateX(40px)}}
@keyframes pinL{from{opacity:0;transform:translateX(-40px)}}
.page.plain{padding-top:calc(var(--st) + 12px)}
.phead{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 6px;min-height:52px}
.h1{font-size:34px;font-weight:800;letter-spacing:-.035em}

/* ===== герой дня ===== */
.hero{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px}
.hrow{display:flex;align-items:center;gap:8px;height:44px}
.hrow>span{font-size:16px;font-weight:600;color:var(--t2)}
.dpill{display:flex;align-items:center;height:44px;border-radius:22px;padding:0 4px}
.dpill button{width:36px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.dpill .lab{min-width:112px;text-align:center;font-size:16px;font-weight:700;color:var(--t1);position:relative;height:44px;overflow:hidden}
.dpill .lab i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;white-space:nowrap}
.reset{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--amb);transition:opacity .35s var(--ease),transform .76s var(--bounce)}
.reset.off{opacity:0;transform:scale(.4) rotate(-90deg);pointer-events:none}
.big{display:flex;align-items:baseline;gap:10px;margin-top:6px;height:84px}
.big b{font-size:80px;font-weight:800;letter-spacing:-.06em;line-height:84px}
.big span{font-size:22px;font-weight:700;color:var(--t2);letter-spacing:-.02em}
.kinds{display:flex;gap:22px;margin-top:2px;font-size:17px;font-weight:700}
.kinds div{display:flex;align-items:center;gap:8px}
.kinds i{width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center}

/* ===== полоса дней ===== */
.days{display:flex;gap:8px;overflow-x:auto;margin:18px -16px 0;padding:0 16px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:16px}
.days::-webkit-scrollbar{display:none}
.day{position:relative;flex:0 0 52px;height:62px;border-radius:18px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;scroll-snap-align:start;transition:background .4s var(--ease),transform .5s var(--spring)}
.day small{font-size:12px;font-weight:600;color:var(--t2);transition:color .3s}
.day b{font-size:18px;font-weight:800;letter-spacing:-.02em;transition:color .3s}
.day.past b{color:rgba(255,255,255,.45)}
.day.today small{color:var(--amb)}
.day i{position:absolute;bottom:6px;width:4px;height:4px;border-radius:2px;background:transparent;transition:background .3s}
.day.has i{background:rgba(255,255,255,.35)}
.day.on{background:var(--ambd);box-shadow:inset 0 0 0 1px var(--ambb)}
.day.on small{color:#FFEACB}.day.on b{color:var(--ambt)}.day.on i{background:rgba(255,247,234,.7)}
.day:active{transform:scale(.9);transition-duration:.12s}

/* ===== записи ===== */
.list{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.list.inL{animation:inL .64s var(--spring)}.list.inR{animation:inR .64s var(--spring)}
@keyframes inL{from{opacity:0;transform:translateX(44px)}}
@keyframes inR{from{opacity:0;transform:translateX(-44px)}}
.cw{position:relative;border-radius:24px}
.cw.enter{animation:up .7s var(--spring) both;animation-delay:calc(var(--i) * 40ms)}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.cw.fresh .card{animation:fresh 1.4s var(--ease)}
@keyframes fresh{0%{background:#3A2F1F}100%{background:var(--card)}}
.del{position:absolute;inset:0;border-radius:24px;background:var(--red);display:flex;align-items:center;justify-content:flex-end;padding-right:22px;font-size:15px;font-weight:700;opacity:0;transition:opacity .2s}
.cw.sw .del{opacity:1}
.card{position:relative;min-height:76px;border-radius:24px;background:var(--card);display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;touch-action:pan-y;transition:transform .64s var(--spring),opacity .3s}
.cw.past .card{opacity:.45}
.ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic.lesson{background:var(--blueT);color:var(--blue)}.ic.call{background:var(--ambT);color:var(--amb)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.nm span{display:block;font-size:14.5px;font-weight:600;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span em{font-style:normal;color:var(--amb)}
.rt{text-align:right;flex-shrink:0}
.rt b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.rt span{display:block;font-size:13px;font-weight:600;color:var(--t3);margin-top:2px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:9vh 20px 0;animation:fade .7s var(--spring)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.empty b{font-size:18px;font-weight:800;margin-top:14px;letter-spacing:-.02em}
.empty span{margin-top:4px;font-size:15px;font-weight:600;color:var(--t2);max-width:270px;line-height:1.4}
.addbtn{margin-top:18px;height:44px;padding:0 20px;border-radius:22px;background:var(--ambd);box-shadow:inset 0 0 0 1px var(--ambb);color:var(--ambt);display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700}

/* ===== нижнее меню и стеклянная капля ===== */
.tabs{position:absolute;left:50%;bottom:calc(var(--sb) + 10px);transform:translateX(-50%);width:300px;height:64px;border-radius:32px;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;z-index:6;touch-action:none;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),inset 0 .5px 0 rgba(255,255,255,.22),0 8px 30px rgba(0,0,0,.5)}
.drop{position:absolute;top:4px;bottom:4px;left:4px;border-radius:28px;z-index:0;background:rgba(255,255,255,.1);
  transition:transform .76s var(--bounce),background .35s var(--ease),box-shadow .35s var(--ease)}
.drop.lift{background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.32),inset 0 1px 0 rgba(255,255,255,.4),0 6px 22px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(1px) saturate(220%) brightness(1.2);backdrop-filter:blur(1px) saturate(220%) brightness(1.2)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:rgba(255,255,255,.92);transition:color .3s}
.tab.on{color:var(--amb)}
.tab svg{transition:transform .76s var(--bounce)}
.tab.on svg{transform:scale(1.08)}

/* ===== сегменты ===== */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:40px;border-radius:20px;background:var(--fill2);padding:3px;touch-action:pan-y}
.seg .drop{top:3px;bottom:3px;left:3px;border-radius:17px;background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.22)}
.seg .drop.lift{background:rgba(120,120,128,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 6px 18px rgba(0,0,0,.3)}
.seg button{position:relative;z-index:1;font-size:14.5px;font-weight:700;color:var(--t2);transition:color .3s}
.seg button.on{color:#fff}

/* ===== шторка ===== */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(var(--st) + 12px);z-index:21;background:#1C1C1E;border-radius:36px 36px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .64s var(--spring);box-shadow:inset 0 .5px 0 rgba(255,255,255,.1)}
body.sheet-open .sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(235,235,245,.3);margin:7px auto 0}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 6px;touch-action:none}
.sh-ttl{font-size:17px;font-weight:800;letter-spacing:-.02em}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(var(--sb) + 40px)}
.sh-body>*{animation:fade .6s var(--spring) both}
.sh-body>*:nth-child(2){animation-delay:25ms}.sh-body>*:nth-child(3){animation-delay:50ms}.sh-body>*:nth-child(4){animation-delay:75ms}.sh-body>*:nth-child(5){animation-delay:100ms}.sh-body>*:nth-child(n+6){animation-delay:125ms}
.cbtn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--fill2);transition:background .35s var(--ease),color .35s,transform .5s var(--spring)}
.cbtn:active{transform:scale(.88);transition-duration:.12s}
.cbtn.dis{color:var(--t3)}
.cbtn.ok{background:var(--ambd);box-shadow:inset 0 0 0 1px var(--ambb);color:var(--ambt)}
.cbtn.pop{animation:pop .76s var(--bounce)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.sheet .day{background:var(--card2)}
.sheet .days{margin-top:0}

.lbl{font-size:13px;font-weight:700;color:var(--t2);margin:22px 4px 9px;text-transform:uppercase;letter-spacing:.03em}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{position:relative;height:54px;border-radius:16px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .35s var(--ease),color .3s,transform .5s var(--spring)}
.slot b{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.slot small{font-size:10.5px;font-weight:700;color:var(--t3);margin-top:1px}
.slot:not(:disabled):active{transform:scale(.9);transition-duration:.12s}
.slot.on{background:var(--ambd);box-shadow:inset 0 0 0 1px var(--ambb);color:var(--ambt)}
.slot.on small{color:#FFE2B8}
.slot.busy{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);color:var(--t3)}
.slot.busy b{font-size:15px;text-decoration:line-through;text-decoration-thickness:1.5px}
.slot.pst:not(.on){color:var(--t2)}
.warn{color:#FF6961;font-size:14px;font-weight:700;margin:0 4px}
.warn:not(:empty){margin-top:12px;animation:fade .4s var(--spring)}
.note{font-size:13.5px;font-weight:700;color:var(--amb);margin:10px 4px 0}
.note:empty{display:none}

.grp{background:var(--card2);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;min-height:52px;padding:0 16px;gap:12px;font-size:16px;font-weight:600;width:100%;text-align:left}
.row input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;font-weight:600;padding:15px 0}
.row .v{margin-left:auto;color:var(--t2);font-weight:600}
.row .k{width:92px;flex-shrink:0;color:var(--t2)}
.sep{height:.5px;background:var(--sep);margin-left:16px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 15px;border-radius:19px;background:var(--card2);font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px;transition:transform .5s var(--spring),background .25s;animation:fade .45s var(--spring) both}
.chip:active{transform:scale(.9);background:#3A3A3C;transition-duration:.12s}
.chip.on{background:var(--ambd);box-shadow:inset 0 0 0 1px var(--ambb);color:var(--ambt)}
.chip .ava{margin-left:-9px}
.danger{width:100%;height:54px;border-radius:18px;background:var(--card2);color:var(--red);font-size:16px;font-weight:700;margin-top:24px}
.btn{width:100%;height:54px;border-radius:18px;background:var(--ambd);box-shadow:inset 0 0 0 1px var(--ambb);color:var(--ambt);font-size:16px;font-weight:800}
.btn.alt{background:var(--card2);box-shadow:none;color:var(--t1)}
.hdr{font-size:13px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.03em;margin:22px 6px 9px}
.prow{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px 8px 10px;width:100%;text-align:left}
.prow .ic{width:42px;height:42px;border-radius:13px}
.prow .n{flex:1;min-width:0}
.prow .n div{font-size:16px;font-weight:700}.prow .n span{font-size:13px;font-weight:600;color:var(--t2)}

/* ===== ученики ===== */
.shero{display:flex;flex-direction:column;align-items:center;padding:4px 0 2px}
.shero .big{margin-top:0}
.alert{margin-top:16px;border-radius:22px;padding:14px 16px;background:rgba(244,167,59,.12);display:flex;align-items:center;gap:12px;animation:up .7s var(--spring) both;animation-delay:120ms;width:100%;text-align:left}
.alert b{font-size:15px;font-weight:800;color:#FFCF8A}.alert span{display:block;font-size:13.5px;font-weight:600;color:rgba(255,207,138,.7);margin-top:1px}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.stile{position:relative;border-radius:26px;background:var(--card);padding:14px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:170px;animation:up .7s var(--spring) both;animation-delay:calc(var(--i) * 45ms + 100ms);transition:transform .5s var(--spring)}
.stile:active{transform:scale(.96);transition-duration:.12s}
.stile .tr{display:flex;align-items:flex-start;justify-content:space-between;width:100%}
.stile .nm2{margin-top:auto;width:100%}
.stile .nm2 b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stile .nm2 span{display:block;font-size:13px;font-weight:600;color:var(--t2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stile .nx{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--t3);margin-top:8px;white-space:nowrap;overflow:hidden}
.stile .nx.soon{color:var(--amb)}
.ava{position:relative;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0;letter-spacing:0;overflow:hidden}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.ava img.ok{opacity:1}
.ring{position:relative;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.ring .bgc{stroke:rgba(255,255,255,.08)}
.ring .fg{transition:stroke-dashoffset 1.1s var(--spring)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.badge{height:28px;padding:0 11px;border-radius:14px;display:flex;align-items:center;font-size:12.5px;font-weight:800;background:var(--fill2);color:var(--t2)}

.phero{display:flex;flex-direction:column;align-items:center;padding:4px 0 2px}
.phero h2{margin:12px 0 0;font-size:26px;font-weight:800;letter-spacing:-.035em;text-align:center}
.phero .sub{font-size:14.5px;font-weight:600;color:var(--t2);margin-top:3px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.act{height:68px;border-radius:20px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--t1)}
.act svg{color:var(--amb)}
.act.tg svg{color:#2AABEE}
.counter{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:22px;padding:14px}
.counter .c{display:flex;flex-direction:column;align-items:center;flex:1}
.counter .c b{font-size:46px;font-weight:800;letter-spacing:-.05em;line-height:50px}
.counter .c b.bump{animation:pop .7s var(--bounce)}
.counter .c span{font-size:13px;font-weight:600;color:var(--t2)}
.stp{width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;background:var(--fill2)}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.dots i{width:9px;height:9px;border-radius:5px;background:rgba(255,255,255,.1);transition:background .5s var(--ease)}
.dots i.f{background:var(--amb)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats3 div{background:var(--card2);border-radius:18px;padding:12px 13px}
.stats3 b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em}.stats3 span{font-size:12px;font-weight:600;color:var(--t2)}
.stepper{display:flex;align-items:center;gap:6px;margin-left:auto}
.stepper button{width:34px;height:34px;border-radius:17px;background:var(--fill);display:flex;align-items:center;justify-content:center}
.stepper b{min-width:30px;text-align:center;font-size:17px;font-weight:800}

.toast{position:fixed;left:50%;top:calc(var(--st) + 8px);z-index:40;transform:translate(-50%,-160%);padding:13px 20px;border-radius:24px;font-size:14.5px;font-weight:700;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;transition:transform .76s var(--bounce);background:rgba(44,44,46,.82)}
.toast.on{transform:translate(-50%,0)}

.onb{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 20px) 20px calc(var(--sb) + 30px);transition:opacity .6s var(--ease),transform .64s var(--spring)}
.onb.away{opacity:0;transform:scale(1.04);pointer-events:none}
.onb>*{animation:fade .8s var(--spring) both}
.onb>*:nth-child(2){animation-delay:60ms}.onb>*:nth-child(3){animation-delay:120ms}.onb>*:nth-child(4){animation-delay:180ms}.onb>*:nth-child(n+5){animation-delay:240ms}
.onb .logo{width:64px;height:64px;border-radius:20px;background:rgba(244,167,59,.18);color:var(--amb);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.onb h1{font-size:34px;font-weight:800;letter-spacing:-.04em;margin:0 0 8px}
.onb p{margin:0 0 24px;color:var(--t2);font-size:16px;font-weight:600;line-height:1.45}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

        </div>
        <button class="reset off tap" id="dReset" aria-label="Вернуться на сегодня"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></button>
      </div>
      <div class="big"><b id="hNum">0</b><span id="hWord">записей</span></div>
      <div class="kinds">
        <div><i style="background:var(--blueT);color:var(--blue)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C7 4.5 9.8 4.8 12 6.4v13c-2.2-1.6-5-1.9-8-.9z"/><path d="M20 5.5c-3-1-5.8-.7-8 .9v13c2.2-1.6 5-1.9 8-.9z"/></svg></i><span id="hL">0 уроков</span></div>
        <div><i style="background:var(--ambT);color:var(--amb)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="3"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/></svg></i><span id="hC">0 созвонов</span></div>

    <div class="days" id="days"></div>
    <div class="list" id="list"></div>
  </main>
  <main class="page plain" id="pSet"></main>

  <nav class="tabs glass" id="tabs">

      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9.5" cy="8" r="3.6"/><path d="M3 19.5c.6-3.6 3.2-5.6 6.5-5.6s5.9 2 6.5 5.6"/><path d="M16 4.6a3.4 3.4 0 0 1 0 6.6M18 14.2c1.8.6 3 2.3 3.4 5.3"/></svg>
      <span>Ученики</span>
    </button>
    <button class="tab on" data-v="list">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4M8 14h3"/></svg>
      <span>Записи</span>
    </button>
    <button class="tab" data-v="set">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>

</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<div class="toast glass" id="toast"></div>
<div class="onb away" id="onb"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
/* Ключи Supabase лежат в config.js (window.RS_CONFIG). Этот файл обновляй смело, ключи не потеряются. */
const CONFIG = window.RS_CONFIG || { url: '', key: '' };

const T_E = 'sched_entries', T_S = 'sched_students';
const KIND = { lesson: 'Урок', call: 'Созвон' };
const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const WDL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const SLOTS = []; for (let h = 8; h <= 22; h++) SLOTS.push(h * 60);
const AV = [['#1E2A44','#8FB4FF'],['#1D3326','#7FD69A'],['#3D2A22','#FFAE8A'],['#33263F','#C9A2FF'],['#1B3239','#7FD0E6'],['#3A3520','#E6D27A'],['#3D2235','#FF9FCB']];
const SPRING = (() => { try { const v = getComputedStyle(document.documentElement).getPropertyValue('--spring').trim(); return CSS.supports('transition-timing-function', v) ? v : 'cubic-bezier(.32,.72,0,1)'; } catch (e) { return 'cubic-bezier(.32,.72,0,1)'; } })();

const ICO = {
  lesson: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C7 4.5 9.8 4.8 12 6.4v13c-2.2-1.6-5-1.9-8-.9z"/><path d="M20 5.5c-3-1-5.8-.7-8 .9v13c2.2-1.6 5-1.9 8-.9z"/></svg>`,
  call: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="3"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/></svg>`,
  x: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>',
  ok: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg>',
  plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  tg: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M21.4 4.3 2.9 11.4c-1.3.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.4l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.5c.3-1.3-.5-1.8-1.4-1.1zM9.8 14.2l-.4 4-1.6-5 9.6-6.1z"/></svg>`,
  cal: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>`,
  check: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.7 2.7L16.2 9.5"/></svg>`,
  clock: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>`
};

const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => new Date(s + 'T00:00:00');
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const hm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const today = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const vib = (n = 8) => { try { navigator.vibrate && navigator.vibrate(n); } catch (e) {} };
const LS = k => { try { return JSON.parse(localStorage.getItem('rs_' + k)); } catch (e) { return null; } };
const SS = (k, v) => { try { localStorage.setItem('rs_' + k, JSON.stringify(v)); } catch (e) {} };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const genCode = () => { const a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; const b = new Uint8Array(8); crypto.getRandomValues(b); return [...b].map(x => a[x % a.length]).join(''); };
const dd = s => { const d = pd(s); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1); };
const longDay = s => { const d = pd(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const relDay = s => { const t = today(); if (s === t) return 'сегодня'; if (s === addD(t, 1)) return 'завтра'; if (s === addD(t, -1)) return 'вчера'; if (s === addD(t, -2)) return 'позавчера'; return WD[pd(s).getDay()].toLowerCase() + ', ' + dd(s); };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const pillDay = s => { const t = today(); if (s === t) return 'Сегодня'; if (s === addD(t, 1)) return 'Завтра'; if (s === addD(t, -1)) return 'Вчера'; return WD[pd(s).getDay()] + ', ' + longDay(s); };
const norm = s => String(s || '').trim().toLowerCase().replace(/ё/g, 'е');
const plural = (n, a, b, c) => { n = Math.abs(n); const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
const initials = n => String(n).trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
const avc = n => { let h = 0; for (const ch of norm(n)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return AV[h % AV.length]; };
const ended = e => e.day < today() || (e.day === today() && e.start_min + e.dur_min <= nowMin());
const money = v => (Number(v) || 0).toLocaleString('ru-RU');
const tgNick = v => String(v || '').trim().replace(/^https?:\/\/t\.me\//i, '').replace(/^@/, '').replace(/[^\w]/g, '');
const sortKey = e => e.day + hm(e.start_min);
const durTxt = m => m === 60 ? '1 ч' : m === 90 ? '1,5 ч' : m === 120 ? '2 ч' : m + ' мин';

let me = LS('me');
let entries = LS('cache') || [];
let students = LS('stu') || [];
let sel = today();
let tab = 'list';
let sb = null, chan = null;

/* ================= данные ================= */
const online = () => !!(CONFIG.url && CONFIG.key && window.supabase && me);
async function connect() {
  if (!online()) return;
  sb = supabase.createClient(CONFIG.url, CONFIG.key, { global: { headers: { 'x-pair': me.pair } }, auth: { persistSession: false } });
  if (chan) { try { chan.unsubscribe(); } catch (e) {} }
  chan = sb.channel('rs-' + me.pair).on('broadcast', { event: 'chg' }, () => pull()).subscribe();
  await pull();
}
async function pull() {
  if (!sb) return;
  const [a, b] = await Promise.all([
    sb.from(T_E).select('*').eq('pair', me.pair).order('day').order('start_min'),
    sb.from(T_S).select('*').eq('pair', me.pair).order('name')
  ]);
  if (a.error) { toast('База: ' + a.error.message); return; }
  entries = a.data.map(r => ({ ...r, price: r.price == null ? '' : r.price }));
  SS('cache', entries);
  if (!b.error) { students = b.data.map(s => ({ ...s, prior: s.prior || 0, tg: s.tg || '' })); SS('stu', students); }
  refreshAll(false);
}
const ping = () => { try { chan && chan.send({ type: 'broadcast', event: 'chg', payload: {} }); } catch (e) {} };
async function saveEntry(e) {
  const i = entries.findIndex(x => x.id === e.id);
  if (i >= 0) entries[i] = e; else entries.push(e);
  SS('cache', entries);
  if (sb) {
    const { error } = await sb.from(T_E).upsert({ id: e.id, pair: me.pair, day: e.day, start_min: e.start_min, dur_min: e.dur_min, kind: e.kind, name: e.name, price: e.price === '' ? null : Number(e.price) });
    if (error) toast('Не сохранилось: ' + error.message); else ping();
  }
}
async function delEntry(id) {
  entries = entries.filter(x => x.id !== id); SS('cache', entries);
  if (sb) { const { error } = await sb.from(T_E).delete().eq('id', id); if (error) toast('Не удалилось: ' + error.message); else ping(); }
}
async function saveStu(s) {
  const i = students.findIndex(x => x.id === s.id);
  if (i >= 0) students[i] = s; else students.push(s);
  SS('stu', students);
  if (sb) {
    const { error } = await sb.from(T_S).upsert({ id: s.id, pair: me.pair, name: s.name, plan: s.plan, pkg_total: s.pkg_total, pkg_start: s.pkg_start, price: s.price === '' || s.price == null ? null : Number(s.price), prior: s.prior || 0, tg: s.tg || null });
    if (error) toast('Ученик не сохранился: ' + error.message); else ping();
  }
}
async function delStu(id) {
  students = students.filter(x => x.id !== id); SS('stu', students);
  if (sb) { const { error } = await sb.from(T_S).delete().eq('id', id); if (error) toast('Не удалилось: ' + error.message); else ping(); }
}
async function renameEntries(from, to) {
  if (norm(from) === norm(to)) return;
  entries.forEach(e => { if (norm(e.name) === norm(from)) e.name = to; }); SS('cache', entries);
  if (sb) await sb.from(T_E).update({ name: to }).eq('pair', me.pair).eq('name', from);
}
const clash = (day, start, dur, ex) => entries.find(e => e.day === day && e.id !== ex && start < e.start_min + e.dur_min && e.start_min < start + dur);
const stuOf = name => students.find(s => norm(s.name) === norm(name));

function stuStats(s) {
  const mine = entries.filter(e => e.kind === 'lesson' && norm(e.name) === norm(s.name));
  const done = mine.filter(ended).sort((a, b) => sortKey(b).localeCompare(sortKey(a)));
  const fut = mine.filter(e => !ended(e)).sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  let used = 0, left = null, planned = 0;
  if (s.plan === 'pkg') {
    used = done.filter(e => e.day >= (s.pkg_start || '0000')).length;
    planned = fut.length;
    left = (s.pkg_total || 0) - used;
  }
  return { total: done.length + (s.prior || 0), inApp: done.length, done, next: fut[0], last: done[0], used, left, planned };
}

/* ================= аватар: фото из Telegram, если ник указан ================= */

/* ================= стеклянный переключатель: тап или вести пальцем ================= */
function glassSwitch(el, value, onChange, opts = {}) {

  const light = i => bs.forEach((b, j) => b.classList.toggle('on', j === i));
  const place = (i, anim = true) => { drop.style.transition = anim ? '' : 'none'; drop.style.transform = `translateX(${i * 100}%)`; light(i); };
  place(cur, false);

  const cwid = () => (w - p0 * 2) / n;

    const c = cwid(), v = x - lastX; lastX = x;

    drop.style.transition = 'transform .14s cubic-bezier(.32,.72,0,1), background .35s, box-shadow .35s';
    drop.style.transform = `translateX(${pos}px) scale(${1.12 * stretch}, 1.22)`;
    const h = at(x); if (h !== hover) { hover = h; light(h); vib(4); }
  };
  const lift = x => { if (lifted) return; lifted = true; drop.classList.add('lift'); vib(10); follow(x); };
  el.addEventListener('pointerdown', ev => {
    down = true; lifted = false; x0 = lastX = ev.clientX; pid = ev.pointerId;
    const r = el.getBoundingClientRect(); w = r.width; left = r.left + p0; hover = cur;
    hold = setTimeout(() => { if (down) lift(lastX); }, 220);

  el.addEventListener('pointermove', ev => {

    if (!down) return; down = false; clearTimeout(hold);
    let i = cur;
    if (lifted) i = hover; else { const b = ev.target.closest && ev.target.closest('button'); if (b && bs.includes(b)) i = bs.indexOf(b); }
    drop.classList.remove('lift'); lifted = false;
    place(i);
    if (i !== cur) { cur = i; vib(); onChange(bs[i].dataset.v); } else if (opts.again) opts.again(bs[i].dataset.v);

}

    h += `<button class="prow tap" data-id="${e.id}"><span class="ic ${e.kind}">${ICO[e.kind](20)}</span><span class="n"><div>${esc(e.name)}</div><span>${KIND[e.kind]} · ${hm(e.start_min)}–${hm(e.start_min + e.dur_min)}</span></span></button>`;
  });
  if (cur) h += '</div>';
  if (!past.length) h += '<div class="empty" style="padding-top:12vh"><b>Пока пусто</b><span>Здесь будут прошедшие уроки и созвоны.</span></div>';
  openSheet(head('История', false) + `<div class="sh-body">${h}</div>`);
  $('#shX').onclick = closeSheet;
  $('#hAdd').onclick = () => later(() => openEditor(null, { day: today(), past: true }));
  sheet.querySelectorAll('.prow').forEach(b => b.onclick = () => { const e = entries.find(x => x.id === b.dataset.id); later(() => openEditor(e)); });
}

/* ================= ученики ================= */
let stuFilter = 'all';
function ringSVG(left, total, size = 48) {
  const r = size / 2 - 4, c = 2 * Math.PI * r, p = total > 0 ? Math.max(0, Math.min(1, left / total)) : 0;
  const col = left <= 0 ? '#FF6961' : left <= 1 ? '#F4A73B' : '#30D158';
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle class="bgc" cx="${size / 2}" cy="${size / 2}" r="${r}"/><circle class="fg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${col}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c * (1 - p)}"/></svg><b style="color:${col}">${Math.max(0, left)}</b></div>`;
}
function renderStu(anim = true) {
  const all = students.map(s => ({ s, x: stuStats(s) }));
  const pkg = all.filter(a => a.s.plan === 'pkg'), single = all.filter(a => a.s.plan !== 'pkg');
  const low = pkg.filter(a => a.x.left <= 1).sort((a, b) => a.x.left - b.x.left);
  let rows = stuFilter === 'pkg' ? pkg.slice() : stuFilter === 'single' ? single.slice() : all.slice();
  rows.sort((a, b) => (a.x.next ? sortKey(a.x.next) : '9').localeCompare(b.x.next ? sortKey(b.x.next) : '9') || a.s.name.localeCompare(b.s.name));
  const p = $('#pStu');
  p.innerHTML = `<div class="phead"><div class="h1">Ученики</div><button class="circ glass tap" id="sAdd" aria-label="Новый ученик">${ICO.plus}</button></div>
    <div class="shero"><div class="big"><b id="sNum" data-v="0">0</b><span>${plural(all.length, 'ученик', 'ученика', 'учеников')}</span></div>
      <div class="kinds"><div><i style="background:rgba(48,209,88,.16);color:#30D158">${ICO.check(13)}</i>${pkg.length} абонемент</div><div><i style="background:var(--fill2);color:var(--t2)">${ICO.clock(13)}</i>${single.length} разово</div></div></div>
    ${low.length ? `<button class="alert tap" id="sLow"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4A73B" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.1"/></svg><div><b>Пора продлить абонемент</b><span>${low.map(a => esc(a.s.name) + (a.x.left <= 0 ? ': закончился' : ': осталось 1')).join(' · ')}</span></div></button>` : ''}
    <div style="height:16px"></div>
    ${segHTML('sFilter', [['all', 'Все'], ['pkg', 'Абонемент'], ['single', 'Разово']])}
    <div class="sgrid">${rows.map(({ s, x }, i) => {
      const soon = x.next && (x.next.day === today() || x.next.day === addD(today(), 1));
      const nx = x.next ? `${ICO.cal(13)}${relDay(x.next.day)} в ${hm(x.next.start_min)}` : x.last ? `${ICO.clock(13)}было ${relDay(x.last.day)}` : `${ICO.clock(13)}пока без записей`;
      const sub = s.plan === 'pkg' ? `Осталось ${Math.max(0, x.left)} из ${s.pkg_total || 0}` : (s.price ? `Разово · ${money(s.price)}` : 'Разовые занятия');
      const right = s.plan === 'pkg' ? ringSVG(x.left, s.pkg_total || 0) : (x.total ? `<span class="badge">${x.total} ${plural(x.total, 'занятие', 'занятия', 'занятий')}</span>` : '<span class="badge">новый</span>');
      return `<button class="stile" style="--i:${i}" data-id="${s.id}"><div class="tr">${avaHTML(s.name, s.tg)}${right}</div><div class="nm2"><b>${esc(s.name)}</b><span>${sub}</span><div class="nx${soon ? ' soon' : ''}">${nx}</div></div></button>`;
    }).join('')}</div>
    ${rows.length ? '' : `<div class="empty"><span class="ic lesson" style="width:64px;height:64px;border-radius:20px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9.5" cy="8" r="3.6"/><path d="M3 19.5c.6-3.6 3.2-5.6 6.5-5.6s5.9 2 6.5 5.6M19 8v6M16 11h6"/></svg></span><b>${students.length ? 'Тут пусто' : 'Добавь первого ученика'}</b><span>${students.length ? 'В этой группе пока никого.' : 'Абонемент или разовые. Остаток занятий считается сам по проведенным урокам.'}</span><button class="addbtn tap" id="sAdd2">${ICO.plus}Добавить ученика</button></div>`}`;
  glassSwitch($('#sFilter'), stuFilter, v => { stuFilter = v; renderStu(false); });
  $('#sAdd').onclick = () => openStudent();
  const a2 = $('#sAdd2'); if (a2) a2.onclick = () => openStudent();
  const lw = $('#sLow'); if (lw) lw.onclick = () => openStudent(low[0].s);
  p.querySelectorAll('.stile').forEach(b => b.onclick = () => openStudent(students.find(s => s.id === b.dataset.id)));
  const sn = $('#sNum'); if (anim) rollNum(sn, all.length); else { sn.dataset.v = all.length; sn.textContent = all.length; }
  setTimeout(() => p.querySelectorAll('.ring .fg').forEach(c => c.style.strokeDashoffset = c.dataset.off), anim ? 280 : 20);
}
let S = null;
function openStudent(s) {
  S = s ? { ...s, price: s.price ?? '', prior: s.prior || 0, tg: s.tg || '', isNew: false, oldName: s.name }
        : { id: uid(), name: '', plan: 'pkg', pkg_total: 8, pkg_start: '2000-01-01', price: '', prior: 0, tg: '', isNew: true };
  const x = stuStats(S);
  const nick = tgNick(S.tg);
  openSheet(head(S.isNew ? 'Новый ученик' : '', true) + `<div class="sh-body">
    <div class="phero"><span id="sAvaBox">${avaHTML(S.name || '?', S.tg, 88)}</span>${S.isNew ? '' : `<h2>${esc(S.name)}</h2><div class="sub">${S.plan === 'pkg' ? 'Абонемент' : 'Разовые занятия'} · ${x.total} ${plural(x.total, 'занятие', 'занятия', 'занятий')}</div>`}</div>
    ${S.isNew ? '' : `<div class="acts">
      <button class="act tap" id="aBook">${ICO.cal(22)}Записать</button>
      <button class="act tap" id="aDone">${ICO.check(22)}Провели</button>
      ${nick ? `<a class="act tg tap" href="https://t.me/${nick}" target="_blank" rel="noopener">${ICO.tg(22)}Написать</a>` : `<button class="act tg tap" id="aTg">${ICO.tg(22)}Telegram</button>`}
    </div>`}
    <div class="lbl">Формат</div>
    ${segHTML('sPlan', [['pkg', 'Абонемент'], ['single', 'Разово']])}
    <div id="sPkg"></div>
    <div class="lbl">Данные</div>
    <div class="grp">
      <div class="row"><span class="k">Имя</span><input id="sName" placeholder="Как зовут" autocomplete="off" autocapitalize="words" value="${esc(S.name)}"></div><div class="sep"></div>
      <div class="row"><span class="k">Telegram</span><input id="sTg" placeholder="@ник" autocomplete="off" autocapitalize="none" value="${esc(S.tg)}"></div><div class="sep"></div>
      <div class="row"><span class="k" id="sPriceL">${S.plan === 'pkg' ? 'Абонемент' : 'Занятие'}</span><input id="sPrice" inputmode="decimal" placeholder="Цена, необязательно" value="${esc(S.price)}"></div>
    </div>
    ${S.isNew || !x.done.length ? '' : `<div class="lbl">Последние занятия</div><div class="grp">${x.done.slice(0, 5).map((e, i) => `${i ? '<div class="sep" style="margin-left:62px"></div>' : ''}<button class="prow tap" data-id="${e.id}"><span class="ic lesson">${ICO.lesson(20)}</span><span class="n"><div>${cap(relDay(e.day))}</div><span>${hm(e.start_min)}–${hm(e.start_min + e.dur_min)}</span></span></button>`).join('')}</div>`}
    ${S.isNew ? '' : '<button class="danger tap" id="sDel">Удалить ученика</button>'}
  </div>`);
  $('#shX').onclick = closeSheet;
  glassSwitch($('#sPlan'), S.plan, v => { S.plan = v; $('#sPriceL').textContent = v === 'pkg' ? 'Абонемент' : 'Занятие'; drawPlan(); });
  const redrawAva = () => { $('#sAvaBox').innerHTML = avaHTML(S.name || '?', S.tg, 88); };
  $('#sName').oninput = ev => { S.name = ev.target.value; redrawAva(); validate(); };
  $('#sTg').onchange = ev => { S.tg = tgNick(ev.target.value) ? '@' + tgNick(ev.target.value) : ''; ev.target.value = S.tg; redrawAva(); };
  $('#sPrice').oninput = ev => { S.price = ev.target.value.replace(',', '.').replace(/[^\d.]/g, ''); };
  $('#shOk').onclick = async () => {
    if (!S.name.trim()) { toast('Напиши имя'); vib(20); return; }
    if (students.some(o => o.id !== S.id && norm(o.name) === norm(S.name))) { toast('Такой ученик уже есть'); return; }
    S.tg = tgNick($('#sTg').value) ? '@' + tgNick($('#sTg').value) : '';
    const out = { id: S.id, name: S.name.trim(), plan: S.plan, pkg_total: S.pkg_total, pkg_start: S.pkg_start, price: S.price, prior: S.prior || 0, tg: S.tg };
    if (!S.isNew && S.oldName && S.oldName !== out.name) await renameEntries(S.oldName, out.name);
    closeSheet(); await saveStu(out); refreshAll(false); if (tab === 'stu') renderStu(false);
  };
  if (!S.isNew) {
    $('#aBook').onclick = () => { const n = S.name; later(() => openEditor(null, { name: n, kind: 'lesson' })); };
    $('#aDone').onclick = () => { const n = S.name; later(() => openEditor(null, { name: n, kind: 'lesson', day: today(), past: true })); };
    const at = $('#aTg'); if (at) at.onclick = () => { $('#sTg').focus(); toast('Впиши ник в поле Telegram'); };
    $('#sDel').onclick = () => { const id = S.id; later(() => delStu(id).then(() => renderStu(false))); };
    sheet.querySelectorAll('.prow[data-id]').forEach(b => b.onclick = () => { const e = entries.find(z => z.id === b.dataset.id); later(() => openEditor(e)); });
  }
  drawPlan(); validate(true);
}
function drawPlan() {
  const box = $('#sPkg');
  const x = stuStats(S);
  if (S.plan !== 'pkg') {
    box.innerHTML = `<div style="height:10px"></div><div class="stats3"><div><b id="sTot">${x.total}</b><span>всего</span></div><div><b>${x.last ? dd(x.last.day) : '—'}</b><span>последнее</span></div><div><b>${x.next ? dd(x.next.day) : '—'}</b><span>следующее</span></div></div>
      <div class="grp" style="margin-top:10px"><div class="row">Было до приложения<div class="stepper"><button class="tap" id="pMinus" aria-label="Меньше">${ICO.minus}</button><b id="pVal">${S.prior || 0}</b><button class="tap" id="pPlus" aria-label="Больше">${ICO.plus}</button></div></div></div>`;
    const upd = () => { $('#pVal').textContent = S.prior; $('#sTot').textContent = stuStats(S).total; vib(); };
    $('#pMinus').onclick = () => { if (S.prior > 0) { S.prior--; upd(); } };
    $('#pPlus').onclick = () => { S.prior++; upd(); };
    return;
  }
  const left = Math.max(0, x.left);
  const size = LS('ps_' + S.id) || 8;
  box.innerHTML = `<div style="height:10px"></div>
    <div class="counter"><button class="stp tap" id="sMinus" aria-label="Меньше">${ICO.minus}</button><div class="c"><b id="sLeft">${left}</b><span id="sLeftW">${plural(left, 'занятие осталось', 'занятия осталось', 'занятий осталось')}</span></div><button class="stp tap" id="sPlus" aria-label="Больше">${ICO.plus}</button></div>
    <div class="dots" id="sDots"></div>
    <div class="lbl">${S.isNew ? 'Абонемент на' : 'Продлевать на'}</div>
    <div class="chips" style="margin-top:0" id="sSizes">${[4, 8, 12, 16].map(n => `<button class="chip${size === n ? ' on' : ''}" data-t="${n}">${n} ${plural(n, 'занятие', 'занятия', 'занятий')}</button>`).join('')}</div>
    ${x.planned ? `<div class="note">Еще запланировано: ${x.planned}</div>` : ''}
    ${S.isNew ? '' : '<div style="height:12px"></div><button class="btn tap" id="sRenew">Продлить абонемент</button>'}`;
  const dots = () => { const l = Math.max(0, stuStats(S).left); $('#sDots').innerHTML = Array.from({ length: Math.min(24, Math.max(S.pkg_total, l)) }, (_, i) => `<i class="${i < l ? 'f' : ''}"></i>`).join(''); };
  dots();
  const bump = () => { const l = Math.max(0, stuStats(S).left), b = $('#sLeft'); b.textContent = l; $('#sLeftW').textContent = plural(l, 'занятие осталось', 'занятия осталось', 'занятий осталось'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); dots(); };
  $('#sMinus').onclick = () => { if (stuStats(S).left <= 0) return; S.pkg_total--; vib(); bump(); };
  $('#sPlus').onclick = () => { S.pkg_total++; vib(); bump(); };
  $('#sSizes').onclick = ev => { const c = ev.target.closest('.chip'); if (!c) return; const n = +c.dataset.t; SS('ps_' + S.id, n); $('#sSizes').querySelectorAll('.chip').forEach(z => z.classList.toggle('on', z === c)); vib();
    if (S.isNew) { S.pkg_total = stuStats(S).used + n; bump(); } };
  const rn = $('#sRenew'); if (rn) rn.onclick = () => { const n = LS('ps_' + S.id) || 8; S.pkg_total += n; vib(14); bump(); toast(`Плюс ${n} ${plural(n, 'занятие', 'занятия', 'занятий')}. Нажми галочку`); };
}
function validate(first) { const ok = S.name.trim().length > 0; const b = $('#shOk'); const was = b.classList.contains('ok'); b.classList.toggle('dis', !ok); b.classList.toggle('ok', ok); if (ok && !was && !first) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); } }

/* ================= настройки ================= */
function renderSet() {
  $('#pSet').innerHTML = `<div class="phead"><div class="h1">Настройки</div></div>
    <div class="hdr" style="margin-top:6px">Я веду</div>
    ${segHTML('setRole', [['lesson', 'Уроки'], ['call', 'Созвоны']])}
    <div class="hdr">Общее расписание</div>
    <div class="grp">
      <div class="row">Код пары<span class="v" style="letter-spacing:.08em">${esc(me.pair)}</span></div>
      <div class="sep"></div>
      <button class="row tap" id="setCopy" style="color:var(--amb)">Скопировать код</button>
      <div class="sep"></div>
      <button class="row tap" id="setJoin">Подключиться к другому коду<span class="v">›</span></button>
    </div>
    <div class="hdr">Синхронизация</div>
    <div class="grp"><div class="row"><span style="width:8px;height:8px;border-radius:4px;background:${online() ? 'var(--grn)' : 'var(--t3)'}"></span>${online() ? 'Включена' : 'Выключена: нет config.js'}</div></div>
    <div class="hdr">Важно</div>
    <div class="grp"><div class="row" style="font-weight:600;color:var(--t2);font-size:14px;line-height:1.45;padding:14px 16px">Приложение на экране «Домой» и Safari хранят вход отдельно. Если где-то попросит код, введи этот же код пары, и все подтянется.</div></div>`;
  glassSwitch($('#setRole'), me.role, v => { me.role = v; SS('me', me); });
  $('#setCopy').onclick = async () => { try { await navigator.clipboard.writeText(me.pair); toast('Код скопирован'); } catch (e) { toast(me.pair); } };
  $('#setJoin').onclick = () => {
    openSheet(head('Другой код', false) + `<div class="sh-body"><div class="lbl">Код от партнера</div><div class="grp"><div class="row"><input id="jCode" placeholder="Например K7M2QX9P" autocapitalize="characters" autocomplete="off"></div></div><div style="height:16px"></div><button class="btn tap" id="jGo">Подключиться</button></div>`);
    $('#shX').onclick = closeSheet;
    $('#jGo').onclick = () => { const c = $('#jCode').value.trim().toUpperCase(); if (c.length < 6) { toast('Код слишком короткий'); return; } me.pair = c; SS('me', me); entries = []; students = []; SS('cache', []); SS('stu', []); closeSheet(); renderSet(); refreshAll(false); connect(); toast('Подключено'); };
  };
}

/* ================= вкладки ================= */
const TABS = ['stu', 'list', 'set'];
function goTab(t) {
  if (t === tab) return;
  const dir = TABS.indexOf(t) > TABS.indexOf(tab) ? 'in-r' : 'in-l';
  tab = t; tabSw.set(t);
  ['pStu', 'pList', 'pSet'].forEach((id, i) => { const p = $('#' + id); const on = TABS[i] === t; p.classList.toggle('on', on); p.classList.remove('in-r', 'in-l'); if (on) { void p.offsetWidth; p.classList.add(dir); } });
  $('#top').classList.toggle('away', t !== 'list');
  if (t === 'stu') renderStu(true); if (t === 'set') renderSet();
}
const tabSw = glassSwitch($('#tabs'), 'list', v => goTab(v), { free: true, again: v => { if (v === 'list') { $('#pList').scrollTo({ top: 0, behavior: 'smooth' }); if (sel !== today()) selectDay(today()); } } });

/* ================= шапка ================= */
$('#pList').addEventListener('scroll', e => $('#top').classList.toggle('scrolled', e.target.scrollTop > 6), { passive: true });
$('#bAdd').onclick = () => openEditor();
$('#bHist').onclick = openHistory;
$('#pickDate').addEventListener('focus', e => { e.target.value = sel; });
$('#pickDate').addEventListener('change', e => { const d = e.target.value; if (!d || d === sel) return; vib(); const dir = d > sel ? 'inL' : 'inR'; sel = d; renderDays($('#days'), sel, selectDay); renderHero(dir); renderList(true, dir); });

/* ================= тост ================= */
let tT;
function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ================= первый вход ================= */
function onboarding() {
  const o = $('#onb'); let role = 'lesson';
  o.innerHTML = `<div class="logo">${ICO.cal(30)}</div>
    <h1>Расписание на двоих</h1><p>Видно, когда у второго урок или созвон, и куда можно ставить. Уже есть код? Введи его ниже.</p>
    <div class="lbl" style="margin-top:0">Я веду</div>
    ${segHTML('oRole', [['lesson', 'Уроки'], ['call', 'Созвоны']])}
    <div style="height:24px"></div>
    <button class="btn tap" id="oNew">Создать общее расписание</button>
    <div class="lbl">Или код от партнера</div>
    <div class="grp"><div class="row"><input id="oCode" placeholder="Код" autocapitalize="characters" autocomplete="off"></div></div>
    <div style="height:10px"></div>
    <button class="btn alt tap" id="oJoin">Подключиться</button>`;
  o.classList.remove('away');
  glassSwitch($('#oRole'), role, v => role = v);
  const done = code => { me = { pair: code, role }; SS('me', me); o.classList.add('away'); refreshAll(true); connect(); };
  $('#oNew').onclick = () => { const c = genCode(); done(c); setTimeout(() => toast('Код ' + c + ' есть в Настройках, отправь его'), 700); };
  $('#oJoin').onclick = () => { const c = $('#oCode').value.trim().toUpperCase(); if (c.length < 6) { toast('Введи код полностью'); return; } done(c); };
}

/* ================= старт ================= */
renderDays($('#days'), sel, selectDay);
renderHero(); renderList(true);
if (!me) onboarding(); else connect();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (sb) pull(); else refreshAll(false); } });
setInterval(() => { if (!document.hidden && !document.body.classList.contains('sheet-open')) refreshAll(false); }, 60000);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
